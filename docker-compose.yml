# =============================================================================
# docker-compose.yml — Antrean Farmasi
# Digunakan untuk deploy di aaPanel Docker
#
# OPSI A (Recommended): Gunakan MySQL dari aaPanel host
#   DB_HOST=host.docker.internal
#
# OPSI B: MySQL di container terpisah (uncomment service 'db' di bawah)
# =============================================================================

services:

  # ─────────────────────────────────────────────────
  # Aplikasi utama (PHP-FPM + Nginx + Queue + Reverb)
  # ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antrian-farmasi-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"       # HTTP app
      - "${REVERB_PORT:-8080}:8080"  # WebSocket Reverb
    volumes:
      - app-storage:/var/www/html/storage
      - app-logs:/var/www/html/storage/logs
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - antrian-net
    depends_on:
      - db        # hapus baris ini jika pakai MySQL dari host aaPanel

  # ─────────────────────────────────────────────────
  # MySQL container (OPSI B — hapus komentar jika dipakai)
  # ─────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: antrian-farmasi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-antrian_farmasi}"
      MYSQL_USER: "${DB_USERNAME:-antrian_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3388:3306"   # Port MySQL (akses dari aaPanel jika perlu)
    networks:
      - antrian-net

volumes:
  app-storage:
    driver: local
  app-logs:
    driver: local
  db-data:
    driver: local

networks:
  antrian-net:
    driver: bridge
